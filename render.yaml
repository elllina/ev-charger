services:
  # Backend API
  - type: web
    name: ev-charging-api
    env: node
    region: frankfurt # Closest to Armenia
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ev-charging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ev-charging-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
    autoDeploy: true

  # Redis
  - type: redis
    name: ev-charging-redis
    region: frankfurt
    plan: starter
    ipAllowList: [] # Only allow internal connections

# PostgreSQL Database
databases:
  - name: ev-charging-db
    region: frankfurt
    plan: starter
    databaseName: ev_charging
    user: ev_charging_user
    postgresMajorVersion: 15
